<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課堂文字雲互動</title>
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", -apple-system, sans-serif;
    background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
    color: #fff; min-height: 100vh;
  }

  /* ===== 共用 ===== */
  .hidden { display: none !important; }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px; padding: 24px;
  }

  /* ===== 老師大螢幕 ===== */
  #teacher { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 18px; }
  .question { font-size: 32px; font-weight: 700; line-height: 1.3; }
  .question .small { font-size: 15px; font-weight: 400; opacity: 0.6; display:block; margin-top:6px;}
  .join-box { display: flex; align-items: center; gap: 18px; background: #fff; color: #1e3a5f; padding: 14px 18px; border-radius: 14px; }
  .join-box .info { text-align: left; }
  .join-box .info b { font-size: 13px; color: #5a6c7d; display: block; }
  .join-box .info .url { font-size: 13px; word-break: break-all; max-width: 260px; }
  .join-box .info .code { font-size: 34px; font-weight: 800; letter-spacing: 3px; color: #e63946; }
  #qrcode img { display: block; }

  #cloudWrap { position: relative; height: 62vh; margin-top: 16px; }
  #cloud { width: 100%; height: 100%; }
  .stats { position: absolute; top: 12px; right: 16px; font-size: 14px; opacity: 0.55; }
  .empty-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; opacity: 0.4; }

  .controls { margin-top: 14px; display: flex; gap: 12px; justify-content: center; }
  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: 10px;
    padding: 11px 22px; font-size: 15px; font-weight: 600; transition: .15s;
  }
  .btn-clear { background: #e63946; color: #fff; }
  .btn-clear:hover { background: #c92a37; }
  .btn-ghost { background: rgba(255,255,255,0.12); color: #fff; }
  .btn-ghost:hover { background: rgba(255,255,255,0.22); }

  /* ===== 設定畫面 ===== */
  #setup { max-width: 520px; margin: 8vh auto; padding: 20px; }
  #setup h1 { font-size: 26px; margin-bottom: 6px; }
  #setup p.sub { opacity: 0.6; margin-bottom: 24px; }
  #setup label { display: block; font-size: 14px; margin: 16px 0 6px; opacity: 0.8; }
  #setup input {
    width: 100%; padding: 13px 16px; border-radius: 10px; border: none;
    font-size: 16px; font-family: inherit;
  }
  #setup .btn-go { width: 100%; margin-top: 26px; background: #2a9d8f; color: #fff; font-size: 17px; padding: 15px; }
  #setup .btn-go:hover { background: #248277; }

  /* ===== 學員手機 ===== */
  #student { max-width: 480px; margin: 0 auto; padding: 28px 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  #student .q { font-size: 24px; font-weight: 700; margin-bottom: 8px; line-height: 1.35; }
  #student .room-tag { font-size: 13px; opacity: 0.5; margin-bottom: 24px; }
  #student input {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    font-size: 18px; font-family: inherit; text-align: center;
  }
  #student .btn-send { width: 100%; margin-top: 16px; background: #2a9d8f; color: #fff; font-size: 18px; padding: 16px; }
  #student .btn-send:hover { background: #248277; }
  #student .btn-send:disabled { opacity: 0.5; }
  #sent-list { margin-top: 26px; }
  #sent-list .label { font-size: 13px; opacity: 0.5; margin-bottom: 10px; }
  .chip { display: inline-block; background: rgba(42,157,143,0.3); border: 1px solid #2a9d8f; padding: 7px 14px; border-radius: 20px; margin: 0 6px 8px 0; font-size: 15px; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2a9d8f; padding: 12px 24px; border-radius: 30px; font-weight: 600; opacity: 0; transition: .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ====== 設定畫面（老師第一次打開）====== -->
<div id="setup" class="card hidden">
  <h1>🎯 課堂文字雲</h1>
  <p class="sub">設定題目後，學員掃 QR code 即可即時參與</p>
  <label>題目 / 提問</label>
  <input id="setupQuestion" placeholder="例如：上完 BLS，你記得哪些重點？" value="上完今天的課，你記得哪些重點？">
  <label>房間代碼（學員加入用，可自訂）</label>
  <input id="setupRoom" placeholder="自動產生">
  <button class="btn-go" onclick="startTeacher()">開始 ▶</button>
</div>

<!-- ====== 老師大螢幕 ====== -->
<div id="teacher" class="hidden">
  <div class="top-bar">
    <div class="question" id="tQuestion">題目</div>
    <div class="join-box">
      <div id="qrcode"></div>
      <div class="info">
        <b>學員加入網址</b>
        <div class="url" id="joinUrl">—</div>
        <b style="margin-top:8px">房間代碼</b>
        <div class="code" id="roomCode">—</div>
      </div>
    </div>
  </div>
  <div id="cloudWrap" class="card">
    <div class="stats" id="stats">0 則回覆</div>
    <div class="empty-hint" id="emptyHint">等待學員提交中…</div>
    <canvas id="cloud"></canvas>
  </div>
  <div class="controls">
    <button class="btn-ghost" onclick="location.href=location.pathname">＋ 新題目</button>
    <button class="btn-clear" onclick="clearRoom()">🗑 清除所有回覆</button>
  </div>
</div>

<!-- ====== 學員手機 ====== -->
<div id="student" class="hidden">
  <div class="q" id="sQuestion">題目</div>
  <div class="room-tag" id="sRoom"></div>
  <input id="wordInput" placeholder="輸入你的答案…" maxlength="20" autocomplete="off">
  <button class="btn-send" id="sendBtn" onclick="submitWord()">送出</button>
  <div id="sent-list" class="hidden">
    <div class="label">你已送出：</div>
    <div id="sent-chips"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== Supabase 設定 ======
const SUPABASE_URL = 'https://xhsjtunkkhfnneskbyer.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sFUJRQPJlsrSWc3SL4SrMw_6Gnn9HL3';
const REST = SUPABASE_URL + '/rest/v1/word_cloud';
const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

// ====== 路由：判斷是老師還是學員 ======
const params = new URLSearchParams(location.search);
const room = params.get('room');
const qParam = params.get('q');

if (room) {
  initStudent();
} else {
  // 老師端：顯示設定畫面
  document.getElementById('setup').classList.remove('hidden');
  // 預填一個隨機房間碼
  document.getElementById('setupRoom').value = randomCode();
}

function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

// ============================================================
//  老師端
// ============================================================
let pollTimer = null;
let curRoom = '', curQuestion = '';

function startTeacher() {
  curQuestion = document.getElementById('setupQuestion').value.trim() || '請輸入關鍵字';
  curRoom = (document.getElementById('setupRoom').value.trim() || randomCode()).toUpperCase();

  document.getElementById('setup').classList.add('hidden');
  document.getElementById('teacher').classList.remove('hidden');
  document.getElementById('tQuestion').innerHTML = curQuestion + '<span class="small">學員可重複提交多個答案</span>';

  // 組學員網址（同一個檔案 + room + 題目）
  const studentUrl = location.origin + location.pathname + '?room=' + curRoom + '&q=' + encodeURIComponent(curQuestion);
  document.getElementById('joinUrl').textContent = studentUrl;
  document.getElementById('roomCode').textContent = curRoom;

  // 產生 QR code
  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById('qrcode'), { text: studentUrl, width: 120, height: 120 });

  // 開始輪詢
  refreshCloud();
  pollTimer = setInterval(refreshCloud, 2500);
}

async function refreshCloud() {
  try {
    const res = await fetch(REST + '?room=eq.' + encodeURIComponent(curRoom) + '&select=word', { headers: HEADERS });
    const rows = await res.json();
    document.getElementById('stats').textContent = rows.length + ' 則回覆';

    // 統計詞頻
    const freq = {};
    rows.forEach(r => {
      const w = (r.word || '').trim();
      if (w) freq[w] = (freq[w] || 0) + 1;
    });
    const list = Object.entries(freq);

    const hint = document.getElementById('emptyHint');
    if (list.length === 0) { hint.classList.remove('hidden'); return; }
    hint.classList.add('hidden');

    drawCloud(list);
  } catch (e) { console.error(e); }
}

function drawCloud(list) {
  const canvas = document.getElementById('cloud');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  const maxCount = Math.max(...list.map(x => x[1]));
  const colors = ['#ffd166','#06d6a0','#118ab2','#ef476f','#f78c6b','#83c5be','#fca311','#90e0ef'];

  WordCloud(canvas, {
    list: list,
    gridSize: Math.round(16 * canvas.width / 1024),
    weightFactor: function (size) {
      return Math.max(18, (size / maxCount) * (canvas.height / 4) + 14);
    },
    fontFamily: 'Microsoft JhengHei, PingFang TC, sans-serif',
    color: function () { return colors[Math.floor(Math.random()*colors.length)]; },
    backgroundColor: 'transparent',
    rotateRatio: 0.3,
    rotationSteps: 2,
    shuffle: false,
    drawOutOfBound: false,
  });
}

async function clearRoom() {
  if (!confirm('確定清除「' + curRoom + '」所有回覆？')) return;
  await fetch(REST + '?room=eq.' + encodeURIComponent(curRoom), { method: 'DELETE', headers: HEADERS });
  toast('已清除');
  refreshCloud();
}

// ============================================================
//  學員端
// ============================================================
function initStudent() {
  document.getElementById('student').classList.remove('hidden');
  const q = qParam ? decodeURIComponent(qParam) : '請輸入關鍵字';
  document.getElementById('sQuestion').textContent = q;
  document.getElementById('sRoom').textContent = '房間：' + room;
  document.getElementById('wordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitWord();
  });
  document.getElementById('wordInput').focus();
}

const myWords = [];
async function submitWord() {
  const input = document.getElementById('wordInput');
  const word = input.value.trim();
  if (!word) return;
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  try {
    const res = await fetch(REST, {
      method: 'POST',
      headers: HEADERS,
      body: JSON.stringify({ room: room.toUpperCase(), word: word })
    });
    if (!res.ok) throw new Error(await res.text());
    myWords.push(word);
    renderMyWords();
    input.value = '';
    toast('已送出 ✓');
  } catch (e) {
    toast('送出失敗，請再試一次');
    console.error(e);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

function renderMyWords() {
  const box = document.getElementById('sent-list');
  box.classList.remove('hidden');
  document.getElementById('sent-chips').innerHTML =
    myWords.map(w => '<span class="chip">' + escapeHtml(w) + '</span>').join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
