name: Supabase Keep-Alive

# 每週一自動連線一次 Supabase，避免免費方案因閒置 7 天而暫停。
# 也可在 GitHub Actions 頁面手動執行（workflow_dispatch）。

on:
  schedule:
    - cron: "0 1 * * 1"    # 每週一 UTC 01:00（台灣時間週一上午 9:00）執行一次
  workflow_dispatch:          # 允許手動觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "連線時間: $(date -u)"
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "https://xhsjtunkkhfnneskbyer.supabase.co/rest/v1/word_cloud?select=id&limit=1" \
            -H "apikey: sb_publishable_sFUJRQPJlsrSWc3SL4SrMw_6Gnn9HL3" \
            -H "Authorization: Bearer sb_publishable_sFUJRQPJlsrSWc3SL4SrMw_6Gnn9HL3")
          echo "HTTP 狀態碼: $HTTP_CODE"
          cat /tmp/resp.txt
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 資料庫連線正常，保持喚醒"
          else
            echo "⚠️ 連線異常，請檢查資料庫狀態"
            exit 1
          fi
